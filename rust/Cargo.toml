[workspace]
members = ["crates/document-core", "crates/pdf-engine", "crates/app-api", "crates/ocr-engine", "crates/storage"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "=1.0.100"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
sha2 = "=0.10.9"
tempfile = "=3.23.0"
